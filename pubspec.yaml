name: runner_app
description: "Runner Remote: mobile client for runner-server."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.8.0

dependencies:
  app_links: ^6.4.0
  device_info_plus: ^13.3.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^6.0.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The terminal font, as in desktop Runner (SIL OFL 1.1, see assets/fonts/).
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
