[package]
name = "runner_mobile_core"
version = "0.1.2"
edition = "2024"
publish = false
license = "MIT"
description = "Runner remote-control client core for the mobile app."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Protocol types, Noise/CPace channel and companion messages, shared with Runner.
runner-core = { git = "https://github.com/Ron-1337/runner", rev = "12c867d2f170f7a86900a4632f57f6264934b069" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# A real relay for the end-to-end test; its host side is played with runner-core.
runner-server = { git = "https://github.com/Ron-1337/runner-server", rev = "1e8317d" }
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
