<?xml version="1.0" encoding="UTF-8"?>
<!-- Runner Remote app icon: Runner's green chevron sent out as a remote signal.
     Full-bleed 1024 square; platforms apply their own corner mask.
     Rendered to the Android/iOS launcher PNGs by tool/icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#1A1D1F"/>
      <stop offset="1" stop-color="#0B0C0D"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33FFB0"/>
      <stop offset="1" stop-color="#00D98A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-32 0)">
  <!-- Chevron -->
  <path d="M330 340 L502 512 L330 684" fill="none" stroke="url(#arrow)"
        stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal arcs radiating from the chevron's tip -->
  <path d="M600 400 A158 158 0 0 1 600 624" fill="none" stroke="#12B877"
        stroke-width="64" stroke-linecap="round"/>
  <path d="M690 310 A285 285 0 0 1 690 714" fill="none" stroke="#0B6E48"
        stroke-width="64" stroke-linecap="round"/>
  </g>
</svg>
